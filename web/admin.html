<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Quiz 管理中心</title><link rel='icon' type='image/x-icon' href='favicon.ico'><link rel='stylesheet' href='quiz/style.css'><link rel='stylesheet' href='admin/style.css'><link rel='stylesheet' href='shared/css/modal.css?v=2'></head><body><div class='quiz-toolbar'><h1>🛠 Quiz 管理中心</h1><span class='spacer'></span> <a href='/quiz.html' class='back-link'>← 返回出题页</a> <span id='auth-status' class='auth-status'></span> <button id='logout-btn' hidden>登出</button></div><div class='admin-container' id='admin-container'><div class='login-required' id='login-required'><div class='empty-state'><div class='empty-icon'>🔒</div><h3>请先登录</h3><p>请先在出题页登录，再访问管理中心</p><a href='/quiz.html' class='btn-primary-lg'>去登录 →</a></div></div><div class='admin-main' id='admin-main' hidden><div class='admin-tabs'><button class='admin-tab active' data-tab='bank'>📚 题库管理</button> <button class='admin-tab' data-tab='sessions'>📋 题组管理</button> <button class='admin-tab' data-tab='ocr'>⚙️ OCR 配置</button></div><div class='admin-tab-panel active' id='tab-bank'><section class='card'><h2>🔧 题库管理</h2><div class='import-row'><input type='text' id='qb-search-input' placeholder='输入单词/词组关键词，回车搜索'> <button id='qb-search-btn'>🔍 查询</button></div><p class='hint'>按单词模糊查询（含已归档），可直接编辑字段、归档/复活或删除错误题目</p><div id='qb-results'></div></section></div><div class='admin-tab-panel' id='tab-sessions'><section class='card'><div class='card-header-row'><h2>📋 题组管理</h2><span class='hint' id='sessions-total'>加载中...</span></div><div class='sessions-filters'><div class='filter-item'><label>状态：</label> <select id='session-status-filter'><option value='all'>全部</option><option value='unfinished'>🟡 未完成</option><option value='pending'>🔴 待审核</option><option value='reviewed'>✅ 已审核</option></select></div><div class='filter-item'><label>用户：</label> <select id='session-user-filter'><option value='0'>全部用户</option></select></div></div><div id='sessions-list'></div><div class='sessions-load-more-wrap'><button id='load-more-btn' class='btn-secondary' hidden>加载更多</button></div></section></div><div class='admin-tab-panel' id='tab-ocr'><section class='card'><h2>⚙️ OCR 配置</h2><div class='ocr-config-form'><label>识别服务 <select id='ocr-provider'><option value='local'>本地 PaddleOCR</option><option value='baidu'>百度云 OCR</option></select></label><div id='ocr-local-row'><label>本地服务地址<input type='text' id='local-ocr-url' placeholder='http://10.0.4.20:50006'></label></div><div id='ocr-baidu-rows' hidden><label>APP_ID<input type='text' id='baidu-app-id' autocomplete='off'></label> <label>API_KEY<input type='password' id='baidu-api-key' autocomplete='new-password'></label> <label>SECRET_KEY<input type='password' id='baidu-secret-key' autocomplete='new-password'></label></div><div class='btn-row'><button id='save-ocr-btn' class='btn-primary'>保存配置</button> <button id='test-ocr-btn' class='btn-secondary'>测试连接</button></div><p class='meta' id='ocr-status'></p></div></section></div></div></div><div id='modal-root'></div><script src='shared/js/modal.js?v=3'></script><script src='admin/app.js'></script></body></html>
