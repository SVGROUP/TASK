<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>我的题组</title><link rel='icon' type='image/x-icon' href='favicon.ico'><link rel='stylesheet' href='history/style.css'></head><body><div class='history-toolbar'><span class='title'>📜 我的题组</span> <span class='spacer'></span> <a href='/quiz.html' class='back-link'>← 返回出题页</a> <span id='auth-status' class='auth-status'></span> <button id='login-btn'>登录</button> <button id='logout-btn' hidden>登出</button></div><div class='loading-container' id='loading-container'><div class='empty-state'><div class='empty-icon'>⏳</div><p>加载中...</p></div></div><div class='error-container' id='error-container' hidden><div class='empty-state'><div class='empty-icon'>⚠️</div><h3 id='error-title'>加载失败</h3><p id='error-message'></p><a href='/quiz.html' class='btn-primary-lg'>返回出题页</a></div></div><div class='empty-container' id='login-required' hidden><div class='empty-state'><div class='empty-icon'>🔒</div><h3>请先登录</h3><p>登录后即可查看我的题组</p><button id='login-btn-center' class='btn-primary-lg'>立即登录</button></div></div><div class='empty-container' id='empty-container' hidden><div class='empty-state'><div class='empty-icon'>📭</div><h3>还没有已批改完的题组</h3><p>完成题组后等家长批改完就会显示在这里</p><a href='/quiz.html' class='btn-primary-lg'>去出题 →</a></div></div><div class='history-container' id='history-container' hidden><div class='hint-bar'>仅显示家长已批改完毕的题组，点击卡片查看每题详情</div><div class='session-list' id='session-list'></div><div class='footer-note'>仅显示家长已批改完毕的题组</div></div><div class='modal' id='image-modal' hidden><div class='modal-content modal-image'><span class='modal-close' id='image-modal-close'>&times;</span> <img id='modal-image' src='' alt='手写答案'><div id='modal-image-caption'></div></div></div><div class='modal session-detail-modal' id='session-detail-modal' hidden><div class='modal-content session-detail-modal-content'><div class='session-detail-header'><div class='session-detail-title'
