<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>英语出题</title><link rel='icon' type='image/x-icon' href='favicon.ico'><link rel='stylesheet' href='quiz/style.css'><link rel='stylesheet' href='shared/css/modal.css?v=2'></head><body><div class='quiz-toolbar'><h1>📝 英语出题</h1><span class='spacer'></span> <a href='/' class='back-link'>← 返回首页</a> <span id='auth-status' class='auth-status'></span> <button id='login-btn'>登录</button> <button id='logout-btn' hidden>登出</button></div><div class='quiz-container' id='quiz-container'><div class='login-required' id='login-required'><div class='empty-state'><div class='empty-icon'>🔒</div><h3>请先登录</h3><p>登录后即可导入 CSV / 生成题目 / 导出 Word</p></div></div><div class='quiz-main' id='quiz-main' hidden><section class='card'><h2>📊 题库状态</h2><div id='stats-content' class='stats-content'><p class='loading'>加载中...</p></div></section><section class='card'><h2>📂 导入 CSV</h2><div class='import-row'><input type='file' id='csv-file' accept='.csv'> <button id='analyze-btn' disabled='disabled'>开始分析</button></div><p class='hint'>Step 2 实现：先摸底分析，确认后再入库</p></section><section class='card'><h2>🎲 生成题目</h2><div class='generate-row'><label>题目数量：<input type='number' id='gen-count' value='50' min='1' max='200'></label> <button id='generate-btn'>开始生成</button></div><p class='hint'>Step 4 实现：生成预览（不消耗出题次数），确认导出才计数</p></section></div></div><div id='modal-root'></div><script src='shared/js/modal.js?v=3'></script><script src='quiz/app.js'></script></body></html>
