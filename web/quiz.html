<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>英语出题</title><link rel='icon' type='image/x-icon' href='favicon.ico'><link rel='stylesheet' href='quiz/style.css'><link rel='stylesheet' href='shared/css/modal.css?v=2'><style>.practice-options{display:flex;flex-direction:column;gap:10px;margin:8px 0 4px}.practice-options .opt-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.practice-options .opt-label{min-width:48px;color:#4a5568;font-weight:500}.practice-options .opt-hint{color:#718096;font-size:12px}.practice-options label{display:inline-flex;align-items:center;gap:4px}.practice-options select{padding:4px 6px;border:1px solid #cbd5e0;border-radius:4px;background:#fff}.practice-options input[type=number]{padding:4px 6px;border:1px solid #cbd5e0;border-radius:4px}.practice-options input[type=number]:disabled{background:#edf2f7;color:#a0aec0}.admin-entry-btn{background:#805ad5;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500}.admin-entry-btn:hover{background:#6b46c1}</style></head><body><div class='quiz-toolbar'><h1>📝 英语出题</h1><span class='spacer'></span> <a href='/' class='back-link'>← 返回首页</a> <button id='admin-btn' class='admin-entry-btn' hidden>🛠 管理中心</button> <span id='auth-status' class='auth-status'></span> <button id='account-btn' hidden>账户</button> <button id='login-btn'>登录</button> <button id='logout-btn' hidden>登出</button></div><div class='quiz-container' id='quiz-container'><div class='login-required' id='login-required'><div class='empty-state'><div class='empty-icon'>🔒</div><h3>请先登录</h3><p>登录后即可在线做题 / 导入 CSV</p><button id='login-btn-center' class='btn-primary-lg'>立即登录</button></div></div><div class='quiz-main' id='quiz-main' hidden><section class='card card-primary'><h2>✏️ 开始做题</h2><div class='practice-options'><div class='opt-row'><span class='opt-label'>模式：</span> <label><input type='radio' name='practice-mode' value='smart'> 智能抽题</label> <label><input type='radio' name='practice-mode' value='random' checked='checked'> 纯随机</label></div><div class='opt-row' id='row-random-count'><span class='opt-label'>题数：</span> <label>抽 <input type='number' id='practice-random-count' value='50' min='1' max='500' style='width:70px'> 题</label> <span class='opt-hint'>（全题库随机，不分范围）</span></div><div class='opt-row' id='row-range'><span class='opt-label'>范围：</span> <select id='practice-units' multiple='multiple' size='3' style='min-width:140px;vertical-align:middle'></select> <select id='practice-sections' multiple='multiple' size='2' style='min-width:120px;vertical-align:middle'></select> <span class='opt-hint'>（不选 = 全部范围，按住 Ctrl/Cmd 多选）</span></div><div class='opt-row' id='row-take'><span class='opt-label'>取题：</span> <label><input type='radio' name='practice-take' value='sample' checked='checked'> 抽 <input type='number' id='practice-count' value='50' min='1' max='500' style='width:70px'> 题</label> <label><input type='radio' name='practice-take' value='all'> 范围内全部</label></div><button id='start-practice-btn' class='btn-primary-lg'>🚀 开始做题</button></div><p class='hint'>在线手写答题，后台 OCR 自动判分，智能错题复习</p><div id='unfinished-practice' hidden><hr class='card-divider'><h3>⏸️ 未做完的题组</h3><div id='unfinished-practice-list'></div></div></section><section class='card' id='review-card' hidden><h2>🔍 家长审核</h2><div class='practice-row'><span id='review-pending-text'>加载中...</span> <a href='/review.html' class='btn-primary-lg'>进入审核 →</a></div><p class='hint'>复核 OCR 判分，改判错误识别，帮助孩子进步</p></section><section class='card' id='stats-card'><div class='card-header-row'><h2>📊 题库状态</h2><button id='reset-btn' class='btn-text' title='清零所有题的出题次数，题库保留'>🔄 重置轮换</button></div><div id='stats-content' class='stats-content'><p class='loading'>加载中...</p></div></section><section class='card' id='import-card'><h2>📂 导入 CSV</h2><div class='import-row'><input type='file' id='csv-file' accept='.csv'> <button id='analyze-btn' disabled='disabled'>开始分析</button></div><p class='hint'>选择 CSV 先摸底分析，确认无误后再真正入库</p></section></div></div><div id='modal-root'></div><dialog id='login-dialog' class='app-dialog app-dialog--auth'><form method='dialog' id='login-form'><h3>登录</h3><label>用户名<input id='login-username' name='username' required autocomplete='username'></label> <label>密码<input id='login-password' type='password' name='password' required autocomplete='current-password'></label><menu class='actions'><button value='cancel' class='ghost' formnovalidate>取消</button> <button value='login' class='primary'>登录</button></menu></form></dialog><dialog id='account-dialog' class='app-dialog app-dialog--auth'><form method='dialog' id='account-form'><h3>账户设置</h3><p class='meta' id='account-meta'></p><fieldset><legend>修改密码</legend><label>当前密码<input type='password' name='old_password' autocomplete='current-password'></label> <label>新密码（至少 3 位）<input type='password' name='new_password' autocomplete='new-password'></label> <button type='button' id='change-pw-btn' class='primary small'>修改密码</button></fieldset><fieldset id='ratio-fieldset' hidden><legend>抽题比例（家长设置）</legend><label>词组占比<div class='ratio-row'><input type='range' id='phrase-ratio-slider' min='0' max='100' step='5' value='20'> <span id='phrase-ratio-text' class='ratio-text'>20%</span></div></label><p class='meta' id='ratio-preview'>单词 80% / 词组 20%</p><div class='btn-row'><button type='button' id='save-ratio-btn' class='primary small'>保存比例</button></div><p class='meta' id='ratio-status'></p></fieldset><menu class='actions'><button value='close' class='primary'>关闭</button></menu></form></dialog><script src='shared/js/modal.js?v=3'></script><script src='quiz/app.js'></script></body></html>
