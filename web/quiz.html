<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>英语出题</title><link rel='icon' type='image/x-icon' href='favicon.ico'><link rel='stylesheet' href='quiz/style.css'><link rel='stylesheet' href='shared/css/modal.css?v=2'></head><body><div class='quiz-toolbar'><h1>📝 英语出题</h1><span class='spacer'></span> <a href='/' class='back-link'>← 返回首页</a> <span id='auth-status' class='auth-status'></span> <button id='login-btn'>登录</button> <button id='logout-btn' hidden>登出</button></div><div class='quiz-container' id='quiz-container'><div class='login-required' id='login-required'><div class='empty-state'><div class='empty-icon'>🔒</div><h3>请先登录</h3><p>登录后即可导入 CSV / 生成题目 / 导出 Word</p><button id='login-btn-center' class='btn-primary-lg'>立即登录</button></div></div><div class='quiz-main' id='quiz-main' hidden><section class='card'><div class='card-header-row'><h2>📊 题库状态</h2><button id='reset-btn' class='btn-text' title='清零所有题的出题次数，题库保留'>🔄 重置轮换</button></div><div id='stats-content' class='stats-content'><p class='loading'>加载中...</p></div></section><section class='card'><h2>📂 导入 CSV</h2><div class='import-row'><input type='file' id='csv-file' accept='.csv'> <button id='analyze-btn' disabled='disabled'>开始分析</button></div><p class='hint'>选择 CSV 先摸底分析，确认无误后再真正入库</p></section><section class='card'><h2>🎲 生成题目</h2><div class='generate-row'><label>题目数量：<input type='number' id='gen-count' value='50' min='1' max='200'></label> <button id='generate-btn'>开始生成</button></div><p class='hint'>预览不消耗出题次数，只有确认导出才会 quiz_count +1</p></section></div></div><div id='modal-root'></div><dialog id='login-dialog' class='app-dialog app-dialog--auth'><form method='dialog' id='login-form'><h3>登录</h3><p class='hint'>首次登录会自动注册为管理员账号。</p><label>用户名<input id='login-username' name='username' required autocomplete='username'></label> <label>密码<input id='login-password' type='password' name='password' required autocomplete='current-password'></label><menu class='actions'><button value='cancel' class='ghost' formnovalidate>取消</button> <button value='login' class='primary'>登录</button></menu></form></dialog><script src='shared/js/modal.js?v=3'></script><script src='quiz/app.js'></script></body></html>
