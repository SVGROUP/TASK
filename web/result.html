<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>做题结果</title><link rel='icon' type='image/x-icon' href='favicon.ico'><link rel='stylesheet' href='shared/css/modal.css'><link rel='stylesheet' href='result/style.css'></head><body><div class='result-toolbar'><span class='title'>📊 做题结果</span> <span class='spacer'></span> <a href='/quiz.html' class='back-link'>← 返回出题页</a></div><div class='loading-container' id='loading-container'><div class='empty-state'><div class='empty-icon'>⏳</div><h3>加载结果中...</h3></div></div><div class='error-container' id='error-container' hidden><div class='empty-state'><div class='empty-icon'>❌</div><h3 id='error-title'>加载失败</h3><p id='error-message'></p><a href='/quiz.html' class='btn-primary-lg'>返回出题页</a></div></div><div class='result-container' id='result-container' hidden><div class='stats-card'><h2>🎉 批改完成</h2><div class='stats-grid'><div class='stat-item'><div class='stat-label'>总题数</div><div class='stat-value' id='stat-total'>0</div></div><div class='stat-item stat-correct'><div class='stat-label'>答对</div><div class='stat-value' id='stat-correct'>0</div></div><div class='stat-item stat-wrong'><div class='stat-label'>答错</div><div class='stat-value' id='stat-wrong'>0</div></div><div class='stat-item stat-skipped'><div class='stat-label'>跳过</div><div class='stat-value' id='stat-skipped'>0</div></div><div class='stat-item stat-accuracy'><div class='stat-label'>正确率</div><div class='stat-value' id='stat-accuracy'>0%</div></div><div class='stat-item stat-duration'><div class='stat-label'>用时</div><div class='stat-value' id='stat-duration'>-</div></div></div></div><div class='filter-bar'><button class='filter-btn active' data-filter='all'>全部 <span id='count-all'>(0)</span></button> <button class='filter-btn' data-filter='correct'>✅ 答对 <span id='count-correct'>(0)</span></button> <button class='filter-btn' data-filter='wrong'>❌ 答错 <span id='count-wrong'>(0)</span></button> <button class='filter-btn' data-filter='skipped'>⏭️ 跳过 <span id='count-skipped'>(0)</span></button></div><div class='attempts-list' id='attempts-list'></div></div><div id='image-modal' class='modal' hidden><div class='modal-content modal-image'><span class='modal-close' id='image-modal-close'>&times;</span> <img id='modal-image' src='' alt='手写答案'><p id='modal-image-caption'></p></div></div><div id='question-modal' class='modal' hidden><div class='modal-content modal-question'><span class='modal-close' id='question-modal-close'>&times;</span><h3>完整题目</h3><p id='modal-question-text'></p><div class='modal-answer-row'><strong>正确答案：</strong><span id='modal-question-answer'></span></div><div class='modal-answer-row' id='modal-ocr-row'><strong>OCR 识别：</strong><span id='modal-question-ocr'></span></div></div></div><script src='shared/js/modal.js'></script><script src='result/app.js'></script></body></html>
